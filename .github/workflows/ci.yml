name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: drumandbytes/reusable-actions/.github/workflows/python-action-ci.yml@v1
    with:
      test-dependencies: "pytest pytest-asyncio aiohttp aiofiles pyyaml packaging"
      required-files: |
        action.yml
        .github/scripts/update-versions.py
        .github/scripts/discover-resources.py

  security:
    uses: drumandbytes/reusable-actions/.github/workflows/security-scan.yml@v1
