name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# No paths-ignore: a filtered-out run never reports required-checks-passed,
# which the ruleset requires, so the PR could never merge.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: drumandbytes/reusable-actions/.github/workflows/python-action-ci.yml@v1
    with:
      test-dependencies: "pytest pytest-asyncio aiohttp aiofiles pyyaml packaging ruamel.yaml"
      required-files: |
        action.yml
        .github/scripts/update-versions.py
        .github/scripts/discover-resources.py

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [ci, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
