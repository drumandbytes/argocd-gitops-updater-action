name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: drumandbytes/reusable-actions/.github/workflows/python-action-ci.yml@v1
    with:
      test-dependencies: "pytest pytest-asyncio aiohttp aiofiles pyyaml packaging ruamel.yaml"
      required-files: |
        action.yml
        .github/scripts/update-versions.py
        .github/scripts/discover-resources.py

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
