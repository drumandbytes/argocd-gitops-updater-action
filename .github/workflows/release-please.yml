name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # dnb-robot App token, not GITHUB_TOKEN: the release PR merge and the tag
      # pushes have to get past protecting-main's ruleset, which only bypasses
      # for this installed App (see drumandbytes/dnb-tf rulesets.tf).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: 4773076
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Consumers pin @v1 and expect it to follow patches/minors. Move it (and
      # the vN.M convenience tag) onto every new release.
      - if: ${{ steps.release.outputs['.--release_created'] }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs['.--tag_name'] }}
          MAJOR: ${{ steps.release.outputs['.--major'] }}
          MINOR: ${{ steps.release.outputs['.--minor'] }}
        run: |
          git config user.name "dnb-robot[bot]"
          git config user.email "4773076+dnb-robot[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          for ALIAS in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
            git tag -f "$ALIAS" "$TAG"
            git push origin "$ALIAS" --force
          done
