version: 2
updates:

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    # `fix(deps):` so each bump cuts a patch release.
    commit-message:
      prefix: "fix"
      include: "scope"
