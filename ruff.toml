# https://docs.astral.sh/ruff/configuration/
target-version = "py311"
line-length = 120

exclude = [".git", ".pytest_cache", "__pycache__", ".venv", "venv"]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # function calls in argument defaults
    "SIM102", # nested if is sometimes clearer
    "SIM103", # explicit if/return is sometimes clearer
    "SIM105", # try/except/pass over contextlib.suppress
    "SIM108", # ternary
    "UP007",  # keep Optional over X | Y
]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/*" = ["B011", "SIM"]

[lint.isort]
known-first-party = ["update_versions", "discover_resources"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
